<svg xmlns="http://www.w3.org/2000/svg" class="ami-fingering-diagram" data-note="A4" role="img" aria-labelledby="fingering-A4-title fingering-A4-desc" viewBox="0 0 360 335" style="display:block;width:100%;max-width:360px;min-width:280px;font-family:Arial;color:#111"><title id="fingering-A4-title">Yamaha YAS-280 written A4 fingering</title><desc id="fingering-A4-desc">P means pressed, R means released. Press: Left index, Left middle. Release: Left ring, Right index, Right middle, Right ring, Octave thumb. Leave auxiliary finger controls released.</desc><text x="85" y="18" text-anchor="middle" font-size="16">LEFT HAND</text><text x="275" y="18" text-anchor="middle" font-size="16">RIGHT HAND</text><g data-key="L1" data-pressed="true" aria-label="Left index: pressed"><circle cx="85" cy="55" r="22" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="85" y="61" text-anchor="middle" font-size="18" fill="white">P</text><text x="85" y="94" text-anchor="middle" font-size="14">Left index</text></g><g data-key="L2" data-pressed="true" aria-label="Left middle: pressed"><circle cx="85" cy="125" r="22" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="85" y="131" text-anchor="middle" font-size="18" fill="white">P</text><text x="85" y="164" text-anchor="middle" font-size="14">Left middle</text></g><g data-key="L3" data-pressed="false" aria-label="Left ring: released"><circle cx="85" cy="195" r="22" fill="white" stroke="#222" stroke-width="2"/><text x="85" y="201" text-anchor="middle" font-size="18" fill="#222">R</text><text x="85" y="234" text-anchor="middle" font-size="14">Left ring</text></g><g data-key="R1" data-pressed="false" aria-label="Right index: released"><circle cx="275" cy="55" r="22" fill="white" stroke="#222" stroke-width="2"/><text x="275" y="61" text-anchor="middle" font-size="18" fill="#222">R</text><text x="275" y="94" text-anchor="middle" font-size="14">Right index</text></g><g data-key="R2" data-pressed="false" aria-label="Right middle: released"><circle cx="275" cy="125" r="22" fill="white" stroke="#222" stroke-width="2"/><text x="275" y="131" text-anchor="middle" font-size="18" fill="#222">R</text><text x="275" y="164" text-anchor="middle" font-size="14">Right middle</text></g><g data-key="R3" data-pressed="false" aria-label="Right ring: released"><circle cx="275" cy="195" r="22" fill="white" stroke="#222" stroke-width="2"/><text x="275" y="201" text-anchor="middle" font-size="18" fill="#222">R</text><text x="275" y="234" text-anchor="middle" font-size="14">Right ring</text></g><g data-key="O" data-pressed="false" aria-label="Octave thumb: released"><circle cx="85" cy="285" r="22" fill="white" stroke="#222" stroke-width="2"/><text x="85" y="291" text-anchor="middle" font-size="18" fill="#222">R</text><text x="85" y="324" text-anchor="middle" font-size="14">Octave thumb</text></g><text x="230" y="275" text-anchor="middle" font-size="14">Auxiliary controls</text><text x="230" y="295" text-anchor="middle" font-size="14">released</text></svg>