<svg xmlns="http://www.w3.org/2000/svg" class="ami-clarinet-diagram" data-note="Bb4" role="img" aria-labelledby="clarinet-fingering-Bb4-title clarinet-fingering-Bb4-desc" viewBox="0 0 360 415" style="display:block;width:100%;max-width:360px;min-width:280px;font-family:Arial"><title id="clarinet-fingering-Bb4-title">Yamaha YCL-255 written Bb4 finger holes and keys</title><desc id="clarinet-fingering-Bb4-desc">Cover: none. Open: Thumb hole, Left index, Left middle, Left ring, Right index, Right middle, Right ring. Press: Register key, Throat A key. Release: Left little finger E/B, Right little finger F/C. All other standard finger controls released.</desc><g data-hole="T" data-covered="false" aria-label="Thumb hole: open"><circle cx="50" cy="255" r="20" fill="white" stroke="#222" stroke-width="2"/><text x="50" y="261" font-size="18" text-anchor="middle" fill="#222">O</text><text x="50" y="292" font-size="14" text-anchor="middle">Thumb hole</text></g><g data-hole="L1" data-covered="false" aria-label="Left index: open"><circle cx="80" cy="50" r="20" fill="white" stroke="#222" stroke-width="2"/><text x="80" y="56" font-size="18" text-anchor="middle" fill="#222">O</text><text x="80" y="87" font-size="14" text-anchor="middle">Left index</text></g><g data-hole="L2" data-covered="false" aria-label="Left middle: open"><circle cx="80" cy="110" r="20" fill="white" stroke="#222" stroke-width="2"/><text x="80" y="116" font-size="18" text-anchor="middle" fill="#222">O</text><text x="80" y="147" font-size="14" text-anchor="middle">Left middle</text></g><g data-hole="L3" data-covered="false" aria-label="Left ring: open"><circle cx="80" cy="170" r="20" fill="white" stroke="#222" stroke-width="2"/><text x="80" y="176" font-size="18" text-anchor="middle" fill="#222">O</text><text x="80" y="207" font-size="14" text-anchor="middle">Left ring</text></g><g data-hole="R1" data-covered="false" aria-label="Right index: open"><circle cx="280" cy="50" r="20" fill="white" stroke="#222" stroke-width="2"/><text x="280" y="56" font-size="18" text-anchor="middle" fill="#222">O</text><text x="280" y="87" font-size="14" text-anchor="middle">Right index</text></g><g data-hole="R2" data-covered="false" aria-label="Right middle: open"><circle cx="280" cy="110" r="20" fill="white" stroke="#222" stroke-width="2"/><text x="280" y="116" font-size="18" text-anchor="middle" fill="#222">O</text><text x="280" y="147" font-size="14" text-anchor="middle">Right middle</text></g><g data-hole="R3" data-covered="false" aria-label="Right ring: open"><circle cx="280" cy="170" r="20" fill="white" stroke="#222" stroke-width="2"/><text x="280" y="176" font-size="18" text-anchor="middle" fill="#222">O</text><text x="280" y="207" font-size="14" text-anchor="middle">Right ring</text></g><g data-key="Register" data-pressed="true" aria-label="Register key: pressed"><rect x="158" y="235" width="44" height="40" rx="5" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="180" y="261" font-size="18" text-anchor="middle" fill="white">P</text><text x="180" y="292" font-size="14" text-anchor="middle">Register key</text></g><g data-key="A" data-pressed="true" aria-label="Throat A key: pressed"><rect x="288" y="235" width="44" height="40" rx="5" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="310" y="261" font-size="18" text-anchor="middle" fill="white">P</text><text x="310" y="292" font-size="14" text-anchor="middle">Throat A key</text></g><g data-key="L_EB" data-pressed="false" aria-label="Left little finger E/B: released"><rect x="68" y="330" width="44" height="40" rx="5" fill="white" stroke="#222" stroke-width="2"/><text x="90" y="356" font-size="18" text-anchor="middle" fill="#222">R</text><text x="90" y="387" font-size="14" text-anchor="middle">Left little finger</text><text x="90" y="405" font-size="14" text-anchor="middle">E/B key</text></g><g data-key="R_FC" data-pressed="false" aria-label="Right little finger F/C: released"><rect x="248" y="330" width="44" height="40" rx="5" fill="white" stroke="#222" stroke-width="2"/><text x="270" y="356" font-size="18" text-anchor="middle" fill="#222">R</text><text x="270" y="387" font-size="14" text-anchor="middle">Right little finger</text><text x="270" y="405" font-size="14" text-anchor="middle">F/C key</text></g></svg>
