<svg xmlns="http://www.w3.org/2000/svg" class="ami-flute-diagram" data-note="G4" role="img" aria-labelledby="flute-fingering-G4-title flute-fingering-G4-desc" viewBox="0 0 360 600" style="display:block;width:100%;max-width:360px;min-width:300px;font-family:Arial"><title id="flute-fingering-G4-title">Yamaha YFL-222 written G4 key actions</title><desc id="flute-fingering-G4-desc">Press: B-natural thumb, LH index (C), LH middle (A), LH ring (G), RH Eb pinky. Release: Bb thumb, LH G# pinky, RH index (F), RH middle (E), RH ring (D), Bb trill, D trill, D# trill, Low C# pinky, Low C pinky. B-natural thumb lever selected; no octave key is present.</desc><g data-key="B_thumb" data-pressed="true" aria-label="B-natural thumb: pressed"><circle cx="85" cy="45" r="21" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="85" y="51" text-anchor="middle" font-size="18" fill="white">P</text><text x="85" y="85" text-anchor="middle" font-size="14">B-natural thumb</text></g><g data-key="Bb_thumb" data-pressed="false" aria-label="Bb thumb: released"><circle cx="275" cy="45" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="275" y="51" text-anchor="middle" font-size="18" fill="#222">R</text><text x="275" y="85" text-anchor="middle" font-size="14">Bb thumb</text></g><g data-key="L1" data-pressed="true" aria-label="LH index (C): pressed"><circle cx="85" cy="125" r="21" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="85" y="131" text-anchor="middle" font-size="18" fill="white">P</text><text x="85" y="165" text-anchor="middle" font-size="14">LH index (C)</text></g><g data-key="L2" data-pressed="true" aria-label="LH middle (A): pressed"><circle cx="85" cy="205" r="21" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="85" y="211" text-anchor="middle" font-size="18" fill="white">P</text><text x="85" y="245" text-anchor="middle" font-size="14">LH middle (A)</text></g><g data-key="L3" data-pressed="true" aria-label="LH ring (G): pressed"><circle cx="85" cy="285" r="21" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="85" y="291" text-anchor="middle" font-size="18" fill="white">P</text><text x="85" y="325" text-anchor="middle" font-size="14">LH ring (G)</text></g><g data-key="G_sharp" data-pressed="false" aria-label="LH G# pinky: released"><circle cx="85" cy="365" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="85" y="371" text-anchor="middle" font-size="18" fill="#222">R</text><text x="85" y="405" text-anchor="middle" font-size="14">LH G# pinky</text></g><g data-key="R1" data-pressed="false" aria-label="RH index (F): released"><circle cx="275" cy="125" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="275" y="131" text-anchor="middle" font-size="18" fill="#222">R</text><text x="275" y="165" text-anchor="middle" font-size="14">RH index (F)</text></g><g data-key="R2" data-pressed="false" aria-label="RH middle (E): released"><circle cx="275" cy="205" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="275" y="211" text-anchor="middle" font-size="18" fill="#222">R</text><text x="275" y="245" text-anchor="middle" font-size="14">RH middle (E)</text></g><g data-key="R3" data-pressed="false" aria-label="RH ring (D): released"><circle cx="275" cy="285" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="275" y="291" text-anchor="middle" font-size="18" fill="#222">R</text><text x="275" y="325" text-anchor="middle" font-size="14">RH ring (D)</text></g><g data-key="Eb" data-pressed="true" aria-label="RH Eb pinky: pressed"><circle cx="275" cy="365" r="21" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="275" y="371" text-anchor="middle" font-size="18" fill="white">P</text><text x="275" y="405" text-anchor="middle" font-size="14">RH Eb pinky</text></g><g data-key="Bb_trill" data-pressed="false" aria-label="Bb trill: released"><circle cx="65" cy="455" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="65" y="461" text-anchor="middle" font-size="18" fill="#222">R</text><text x="65" y="495" text-anchor="middle" font-size="14">Bb trill</text></g><g data-key="D_trill" data-pressed="false" aria-label="D trill: released"><circle cx="180" cy="455" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="180" y="461" text-anchor="middle" font-size="18" fill="#222">R</text><text x="180" y="495" text-anchor="middle" font-size="14">D trill</text></g><g data-key="Eb_trill" data-pressed="false" aria-label="D# trill: released"><circle cx="295" cy="455" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="295" y="461" text-anchor="middle" font-size="18" fill="#222">R</text><text x="295" y="495" text-anchor="middle" font-size="14">D# trill</text></g><g data-key="low_C_sharp" data-pressed="false" aria-label="Low C# pinky: released"><circle cx="95" cy="545" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="95" y="551" text-anchor="middle" font-size="18" fill="#222">R</text><text x="95" y="585" text-anchor="middle" font-size="14">Low C# pinky</text></g><g data-key="low_C" data-pressed="false" aria-label="Low C pinky: released"><circle cx="265" cy="545" r="21" fill="white" stroke="#222" stroke-width="2"/><text x="265" y="551" text-anchor="middle" font-size="18" fill="#222">R</text><text x="265" y="585" text-anchor="middle" font-size="14">Low C pinky</text></g></svg>