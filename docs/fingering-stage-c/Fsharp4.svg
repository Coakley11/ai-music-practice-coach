<svg xmlns="http://www.w3.org/2000/svg" class="ami-trumpet-diagram" data-note="F#4" data-partial="3" role="img" aria-labelledby="trumpet-fingering-Fsharp4-title trumpet-fingering-Fsharp4-desc" viewBox="0 0 360 240" style="display:block;width:100%;max-width:360px;min-width:280px;font-family:Arial"><title id="trumpet-fingering-Fsharp4-title">Yamaha YTR-2330 written F#4 valves and partial</title><desc id="trumpet-fingering-Fsharp4-desc">Press: valve 2. Release: valve 1, valve 3. Intended partial 3 (ordinary slot 2).</desc><g data-valve="1" data-pressed="false" aria-label="Valve 1: released"><rect x="39" y="70" width="42" height="87" rx="10" fill="#eee" stroke="#222"/><circle cx="60" cy="60" r="25" fill="white" stroke="#222" stroke-width="2"/><text x="60" y="66" text-anchor="middle" font-size="19" fill="#222">R</text><text x="60" y="185" text-anchor="middle" font-size="17">Valve 1</text></g><g data-valve="2" data-pressed="true" aria-label="Valve 2: pressed"><rect x="159" y="70" width="42" height="87" rx="10" fill="#eee" stroke="#222"/><circle cx="180" cy="60" r="25" fill="#174ea6" stroke="#222" stroke-width="2"/><text x="180" y="66" text-anchor="middle" font-size="19" fill="white">P</text><text x="180" y="185" text-anchor="middle" font-size="17">Valve 2</text></g><g data-valve="3" data-pressed="false" aria-label="Valve 3: released"><rect x="279" y="70" width="42" height="87" rx="10" fill="#eee" stroke="#222"/><circle cx="300" cy="60" r="25" fill="white" stroke="#222" stroke-width="2"/><text x="300" y="66" text-anchor="middle" font-size="19" fill="#222">R</text><text x="300" y="185" text-anchor="middle" font-size="17">Valve 3</text></g><text x="180" y="224" text-anchor="middle" font-size="18">Partial 3 / ordinary slot 2</text></svg>
