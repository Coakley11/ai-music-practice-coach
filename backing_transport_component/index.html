<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Backing transport</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      body { font-family: "Source Sans Pro", "Segoe UI", system-ui, sans-serif; }
      #wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 2px 2px 4px 2px; }
      #btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-height: 44px; min-width: 210px; max-width: 100%;
        padding: 0 20px; border-radius: 11px; border: none; cursor: pointer;
        font-size: 15px; font-weight: 800; letter-spacing: 0.02em; color: #fff;
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 50%, #15803d 100%);
        box-shadow: 0 6px 18px rgba(34, 197, 94, 0.35);
        -webkit-tap-highlight-color: transparent;
      }
      #btn[data-state="playing"] {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        color: #0f172a; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);
      }
      #btn[data-state="starting"] { opacity: 0.8; cursor: progress; }
      #btn:disabled { background: rgba(226, 232, 240, 0.55); color: #64748b; box-shadow: none; cursor: not-allowed; }
      #btn:focus-visible, #pz:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
      #pz {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; min-width: 120px; padding: 0 16px; border-radius: 11px; cursor: pointer;
        font-size: 15px; font-weight: 800; color: #0f172a; background: #fff;
        border: 2px solid rgba(15, 23, 42, 0.18); -webkit-tap-highlight-color: transparent;
      }
      #pz[hidden] { display: none; }
      #pz[data-mode="resume"] { color: #fff; border-color: transparent; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
      #hint { font-size: 13px; font-weight: 700; color: #475569; }
      #hint:empty { display: none; }
      @media (max-width: 420px) { #btn, #pz { width: 100%; min-width: 0; } }
    </style>
  </head>
  <body>
    <div id="wrap"><button id="btn" type="button" data-state="stopped" disabled>▶ Play Backing Track</button><button id="pz" type="button" data-mode="pause" hidden>⏸ Pause</button><span id="hint" aria-live="polite"></span></div>
    <script>
      // Backing card transport. The buttons follow the server's explicit
      // transport intent (stopped / playing / paused): stopped offers Play;
      // playing offers Stop and Pause; paused offers Stop and Resume. The real
      // audio elements (st.audio, the follow-along iframe, the key-cycle
      // buffers) still tell "Starting…" (session started, nothing audible yet)
      // and a natural end. Clicks are sent to Python as intents.
      const LABEL_PLAY = "▶ Play Backing Track";
      const LABEL_STOP = "■ Stop Backing Track";
      const LABEL_PAUSE = "⏸ Pause";
      const LABEL_RESUME = "▶ Resume";
      const SESSION = Math.random().toString(36).slice(2, 10);
      const btn = document.getElementById("btn");
      const pz = document.getElementById("pz");
      const hint = document.getElementById("hint");
      let args = { enabled: false, report_ended: true, server_playing: false, render_id: "", transport: "", restart_on_resume: false, cycle_active: false };
      // A click shows its result at once; the server's render confirms it.
      let localIntent = "";
      let localToken = "";
      let localUntil = 0;
      function setLocal(intent) {
        localIntent = intent;
        localToken = SESSION + ":" + nonce;
        localUntil = Date.now() + 20000;
      }
      function intentNow() {
        if (localIntent && Date.now() < localUntil) return localIntent;
        return String(args.transport || "stopped");
      }
      let lastHeight = 0;
      let nonce = 0;
      let pendingUntil = 0;
      let pendingToken = "";
      // A pending Play outlives a remount of this control (card re-render).
      try {
        const saved = window.parent.__backingTransportPending;
        if (saved && Number(saved.until) > Date.now()) {
          pendingUntil = Number(saved.until);
          pendingToken = String(saved.token || "");
        }
      } catch (e) {}
      function savePending() {
        try { window.parent.__backingTransportPending = pendingUntil ? { until: pendingUntil, token: pendingToken } : null; } catch (e) {}
      }
      let stoppingUntil = 0;
      let wasPlaying = false;
      // Tracks silenced by a Karaoke transition: never counted, nudged or allowed
      // to resume until the destination track plays.
      let silenced = new Set();
      try {
        const sv = window.parent.__backingTransportSilenced;
        if (sv && Number(sv.until) > Date.now() && Array.isArray(sv.srcs)) silenced = new Set(sv.srcs);
      } catch (e) {}
      function saveSilenced() {
        try {
          window.parent.__backingTransportSilenced = silenced.size
            ? { until: pendingUntil || (Date.now() + 120000), srcs: Array.from(silenced) }
            : null;
        } catch (e) {}
      }
      function srcOf(a) {
        // The follow-along player carries the whole WAV as a data: URL (~56 MB);
        // reading currentSrc copies that string, and doing it on every 250 ms
        // tick stalled the player. Identify it by element id and length instead.
        if (!a) return "";
        if (a.id === "live-audio") {
          // It renders with ``controls`` only when it carries audio (cycle mode
          // leaves it muted and empty).
          return a.hasAttribute("controls") ? "live-audio:" + (isFinite(a.duration) ? a.duration.toFixed(2) : "?") : "";
        }
        return String(a.currentSrc || a.src || "");
      }
      let notPlayingSince = 0;

      function post(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
      }
      function send(action) {
        nonce += 1;
        post("streamlit:setComponentValue", { value: { action: action, nonce: nonce, session: SESSION } });
      }
      // Pause and resume of the plain backing players go through here: the
      // card's Pause / Resume and the Lead Sheet's Pause / Resume playback.
      function pauseBackingAudio() {
        let held = null;
        backingAudio().forEach(function (a) {
          if (a && !a.paused && !a.ended && !a.muted && srcOf(a)) {
            if (!held) held = a;
            try { a.pause(); } catch (e) {}
          }
        });
        try {
          window.parent.__backingPausedTake = held
            ? { el: held, t: held.currentTime, dur: held.duration, src: srcOf(held), id: held.id || "" } : null;
        } catch (e) {}
      }
      function resumeBackingAudio() {
        let take = null;
        try { take = window.parent.__backingPausedTake; } catch (e) {}
        let el = take && take.el && take.el.isConnected ? take.el : null;
        if (!el && take) {
          // The paused player was re-created by a rerun (same take, now at 0:00,
          // possibly still loading): continue in the new element from the
          // paused place. The Lead Sheet's player keeps its id.
          el = backingAudio().find(function (a) {
            return a && a.paused && !a.ended && !a.muted && !silenced.has(srcOf(a))
              && ((take.id && a.id === take.id) || (srcOf(a) && srcOf(a) === take.src)
                  || (isFinite(a.duration) && Math.abs(a.duration - Number(take.dur)) < 1.5));
          }) || null;
          if (el) {
            const at = Number(take.t) || 0;
            const seek = function () { try { if (Math.abs(el.currentTime - at) > 0.25) el.currentTime = at; } catch (e) {} };
            if (el.readyState >= 1) seek();
            else el.addEventListener("loadedmetadata", seek, { once: true });
          }
        }
        if (!el) {
          el = backingAudio().find(function (a) {
            return a && a.paused && !a.ended && !a.muted && srcOf(a) && a.currentTime > 0 && !silenced.has(srcOf(a));
          }) || null;
        }
        if (el) { const p = el.play(); if (p && p.catch) p.catch(function () {}); }
        try { window.parent.__backingPausedTake = null; } catch (e) {}
      }
      function doPause(handled) {
        if (!handled) pauseBackingAudio();
        send("pause");
        setLocal("paused");
        render();
      }
      function doResume(handled) {
        const restart = !!args.restart_on_resume;
        // A setting changed while paused: the server starts the new selection.
        if (!restart && !handled) resumeBackingAudio();
        send("resume");
        setLocal("playing");
        if (restart) { pendingUntil = Date.now() + 120000; pendingToken = localToken; savePending(); }
        render();
      }
      try {
        // ``handled``: the caller (the Lead Sheet) already paused / resumed its player.
        window.parent.__backingTransportReport = function (action, opts) {
          const handled = !!(opts && opts.handled);
          if (action === "pause") doPause(handled);
          else if (action === "resume") doResume(handled);
        };
      } catch (e) {}
      // Lead-sheet audio "ended" calls this. It is the same intent the card
      // sends when its own player finishes. Not a button-label click.
      try {
        window.parent.__backingReportKaraokeEnded = function () { send("ended"); };
      } catch (e) {}
      function backingAudio() {
        const out = [];
        let pdoc = null;
        try { pdoc = window.parent.document; } catch (e) { return out; }
        try { pdoc.querySelectorAll("audio").forEach(function (a) { out.push(a); }); } catch (e) {}
        try {
          pdoc.querySelectorAll("iframe").forEach(function (f) {
            try {
              const d = f.contentDocument;
              if (d && d !== document) d.querySelectorAll("audio").forEach(function (a) { out.push(a); });
            } catch (e) {}
          });
        } catch (e) {}
        return out;
      }
      function audiblePlaying() {
        return backingAudio().some(function (a) {
          if (!a || a.paused || a.ended || a.muted || !srcOf(a)) return false;
          if (silenced.has(srcOf(a))) {
            try { a.pause(); } catch (e) {}
            return false;
          }
          return true;
        });
      }
      function nudgeArmedPlayer() {
        // A freshly mounted st.audio can miss its autoplay (Play pressed while the
        // Stop rerun was still running). Only the plain page player is started
        // here; the follow-along and key-cycle players own their own start.
        let pdoc = null;
        try { pdoc = window.parent.document; } catch (e) { return; }
        try {
          pdoc.querySelectorAll('audio[data-testid="stAudio"], [data-testid="stAudio"] audio').forEach(function (a) {
            if (a && a.paused && !a.ended && !a.muted && srcOf(a) && !silenced.has(srcOf(a))) {
              const p = a.play(); if (p && p.catch) p.catch(function () {});
            }
          });
        } catch (e) {}
      }
      // Lead sheet Open / Close swaps the page player for the follow-along player
      // (or back). The playhead is handed over on that click so the music keeps
      // going from where it was instead of stopping. Only those two clicks record
      // a hand-off; nothing else ever resumes audio on its own.
      const HANDOFF_MS = 45000;
      function cycleOwnsAudio() {
        try { const k = window.parent.__kcDual; return !!(k && k.enabled); } catch (e) { return false; }
      }
      function isPagePlayer(a) {
        try {
          return a.matches('audio[data-testid="stAudio"]') || !!a.closest('[data-testid="stAudio"]');
        } catch (e) { return false; }
      }
      function recordHandoff() {
        if (cycleOwnsAudio()) return;
        const a = backingAudio().find(function (x) {
          return x && !x.paused && !x.ended && !x.muted && srcOf(x) && !silenced.has(srcOf(x));
        });
        // A paused take (its own Stop / Resume) keeps its place across the swap.
        const held = a ? null : backingAudio().find(function (x) {
          return x && x.paused && !x.ended && !x.muted && srcOf(x) && !silenced.has(srcOf(x)) && x.currentTime > 0;
        });
        const src = a || held;
        // The outgoing player keeps sounding until the destination player has
        // loaded and takes over at its live position. Pausing it here left the
        // whole Streamlit rerun plus the destination's buffering silent (about
        // five seconds); the swap itself now pauses it, so only one plays.
        try {
          window.parent.__backingPlayheadHandoff = src
            ? { t: src.currentTime, dur: src.duration, at: Date.now(), until: Date.now() + HANDOFF_MS,
                from: srcOf(src).slice(0, 64), el: src, playing: !!a }
            : null;
        } catch (e) {}
      }
      function handoffPosition(h) {
        // The outgoing player's live position; where it stopped if it is gone.
        try {
          const el = h.el;
          if (el && isFinite(el.currentTime) && (el.currentTime > 0 || !h.playing)) return Number(el.currentTime);
        } catch (e) {}
        return Number(h.t) || 0;
      }
      function isHandoffTarget(a, h) {
        return !!(a && h && a !== h.el && isPagePlayer(a) && !a.ended && !a.muted && srcOf(a)
          && srcOf(a).slice(0, 64) !== h.from && !silenced.has(srcOf(a))
          && isFinite(a.duration) && Math.abs(a.duration - Number(h.dur)) < 1.5);
      }
      function currentHandoff() {
        let h = null;
        try { h = window.parent.__backingPlayheadHandoff; } catch (e) { return null; }
        if (!h) return null;
        // The window only retires a hand-off nobody took; while the outgoing
        // player is still sounding (a slow sheet mount) it stays the music.
        const stillSounding = !!(h.playing && h.el && h.el.isConnected && !h.el.paused && !h.el.ended);
        if ((Date.now() > Number(h.until) && !stillSounding) || cycleOwnsAudio()) {
          try { window.parent.__backingPlayheadHandoff = null; } catch (e) {}
          return null;
        }
        return h;
      }
      function takeOver(target, h) {
        // One step: retire the outgoing player, place the destination at its
        // live position, then start it (or leave it paused there).
        const pos = handoffPosition(h);
        try { window.parent.__backingPlayheadHandoff = null; } catch (e) {}
        try { if (h.el && h.el !== target) h.el.pause(); } catch (e) {}
        try {
          const want = Math.max(0, Math.min(pos, target.duration - 0.25));
          if (Math.abs(target.currentTime - want) > 0.12) target.currentTime = want;
        } catch (e) {}
        if (h.playing) {
          if (target.paused) { const p = target.play(); if (p && p.catch) p.catch(function () {}); }
        } else if (!target.paused) {
          try { target.pause(); } catch (e) {}
        }
      }
      function applyHandoff() {
        // The page player (lead sheet just closed) takes over here; the
        // follow-along player takes the hand-off itself when it loads.
        const h = currentHandoff();
        if (!h) return;
        // Only the page player (st.audio) is a target. Any other paused page
        // audio of the same length qualified before: a key-cycle element left
        // loaded after Off was resumed in place of the lead sheet.
        const target = backingAudio().find(function (a) {
          return isHandoffTarget(a, h) && a.readyState >= 2;
        });
        if (target) takeOver(target, h);
      }
      try {
        // Event-driven so the swap happens the moment the page player can play
        // (or autoplays), not on the next 250 ms tick with both players audible.
        const hdoc = window.parent.document;
        if (window.parent.__backingHandoffMediaHook) {
          hdoc.removeEventListener("loadedmetadata", window.parent.__backingHandoffMediaHook, true);
          hdoc.removeEventListener("canplay", window.parent.__backingHandoffMediaHook, true);
          hdoc.removeEventListener("play", window.parent.__backingHandoffMediaHook, true);
        }
        window.parent.__backingHandoffMediaHook = function (ev) {
          const a = ev && ev.target;
          const h = currentHandoff();
          if (!h || !isHandoffTarget(a, h)) return;
          if (ev.type === "loadedmetadata") {
            // Pre-position so an autoplay starts at the live spot.
            try { a.currentTime = Math.max(0, Math.min(handoffPosition(h), a.duration - 0.25)); } catch (e) {}
            return;
          }
          takeOver(a, h);
        };
        hdoc.addEventListener("loadedmetadata", window.parent.__backingHandoffMediaHook, true);
        hdoc.addEventListener("canplay", window.parent.__backingHandoffMediaHook, true);
        hdoc.addEventListener("play", window.parent.__backingHandoffMediaHook, true);
      } catch (e) {}
      function anyEnded() {
        return backingAudio().some(function (a) { return a && a.ended && !a.muted; });
      }
      // The Lead Sheet's player is re-created whenever a rerun changes its
      // HTML; its new player then started over at 0:00. Its live place is kept
      // here and the new player of the same take continues from it.
      function noteSheetPosition() {
        let live = null;
        try { live = backingAudio().find(function (a) { return a && a.id === "live-audio" && srcOf(a); }); } catch (e) {}
        if (!live || live.ended || intentNow() === "stopped") {
          if (live && live.ended) clearSheetPosition();
          return;
        }
        if (!(live.currentTime > 0.3) || !isFinite(live.duration)) return;
        try {
          window.parent.__backingSheetPos = { t: live.currentTime, dur: live.duration, playing: !live.paused, at: Date.now() };
        } catch (e) {}
      }
      function clearSheetPosition() { try { window.parent.__backingSheetPos = null; } catch (e) {} }
      function render() {
        const now = Date.now();
        applyHandoff();
        noteSheetPosition();
        paintDest();
        const playing = audiblePlaying();
        if (playing) {
          notPlayingSince = 0;
          if (silenced.size) { silenced = new Set(); saveSilenced(); }
          if (pendingUntil) { pendingUntil = 0; savePending(); }
        } else if (silenced.size && now >= pendingUntil) { silenced = new Set(); saveSilenced(); }
        else if (!notPlayingSince) { notPlayingSince = now; }
        // Debounce: dual-buffer hand-offs pause one element before the next starts.
        const settledStopped = !playing && (now - notPlayingSince > 700);
        if (wasPlaying && settledStopped) {
          wasPlaying = false;
          if (now > stoppingUntil && args.report_ended && anyEnded()) send("ended");
        }
        if (playing) wasPlaying = true;
        const intent = intentNow();
        if (!playing && now < pendingUntil && args.server_playing && (args.consumed === pendingToken || pendingToken === "transition")) nudgeArmedPlayer();
        if (!playing && now > stoppingUntil && intent === "playing") startMissedAutoplay();
        let state = "stopped";
        if (intent === "paused" && !(playing && now > stoppingUntil)) state = "paused";
        else if (playing && now > stoppingUntil) state = "playing";
        else if (intent === "playing" || now < pendingUntil) state = "starting";
        btn.dataset.state = state;
        // Started, paused or still starting: the session exists and Stop ends it.
        btn.textContent = state === "stopped" ? LABEL_PLAY : LABEL_STOP;
        btn.setAttribute("aria-pressed", state === "stopped" ? "false" : "true");
        btn.setAttribute("aria-busy", state === "starting" ? "true" : "false");
        btn.disabled = state === "stopped" && !args.enabled;
        // Key cycling pauses from its own bar; the card offers Pause / Resume otherwise.
        const showPz = !args.cycle_active && (state === "playing" || state === "paused");
        pz.hidden = !showPz;
        pz.dataset.mode = state === "paused" ? "resume" : "pause";
        pz.textContent = state === "paused" ? LABEL_RESUME : LABEL_PAUSE;
        hint.textContent = state === "starting" ? "Starting…" : state === "paused" ? "Paused" : "";
        try { window.parent.__backingTransportState = { transport: intent, restart_on_resume: !!args.restart_on_resume }; } catch (e) {}
        const h = Math.ceil(document.getElementById("wrap").getBoundingClientRect().height) + 6;
        if (h !== lastHeight) { lastHeight = h; post("streamlit:setFrameHeight", { height: Math.max(52, h) }); }
      }
      function silenceBackingAudio() {
        try { window.parent.__backingPlayheadHandoff = null; } catch (e) {}
        try { if (typeof window.parent.__kcHardStop === "function") window.parent.__kcHardStop(); } catch (e) {}
        backingAudio().forEach(function (a) {
          // Stopped here, at 0:00: never mistaken for a missed autoplay.
          try { a.dataset.autoplayNudged = "stopped"; } catch (e) {}
          try { a.pause(); a.currentTime = 0; } catch (e) {}
        });
        wasPlaying = false;
      }
      function startMissedAutoplay() {
        // A page player mounted to autoplay (a Karaoke entry or destination
        // starting by itself) sometimes never starts: measured on a phone, the
        // take sat loaded and paused at 0:00 in 1 of 3-5 entries. Start each
        // such element once; one stopped by the user is marked and left alone.
        let pdoc = null;
        try { pdoc = window.parent.document; } catch (e) { return; }
        // Streamlit drops autoplay when the player's first render is redone
        // before it commits; the marker after it still says it should play.
        // That run rendered this card before the take existed (server_playing
        // false), so the marker is the only start intent this card receives.
        const intended = new Set();
        try {
          pdoc.querySelectorAll('.backing-page-player-intent[data-autoplay="1"]').forEach(function (m) {
            const box = m.closest('[data-testid="stElementContainer"]');
            const prev = box && box.previousElementSibling;
            const a = prev && prev.querySelector("audio");
            if (a) intended.add(a);
          });
        } catch (e) {}
        try {
          pdoc.querySelectorAll('audio[data-testid="stAudio"], [data-testid="stAudio"] audio').forEach(function (a) {
            if (!a || !((a.autoplay && args.server_playing) || intended.has(a)) || a.dataset.autoplayNudged) return;
            if (!a.paused) { a.dataset.autoplayNudged = "played"; return; }
            if (a.ended || a.muted || a.readyState < 2 || a.currentTime > 0.05 || !srcOf(a) || silenced.has(srcOf(a))) return;
            a.dataset.autoplayNudged = "nudged";
            const p = a.play(); if (p && p.catch) p.catch(function () {});
          });
        } catch (e) {}
      }
      // Karaoke Next / Previous (auto-advance clicks Next too) is a transport
      // transition: the outgoing track stops the moment it is pressed, and the
      // control waits for the destination to actually play. Python runs the
      // existing Next / Previous handler; nothing else changes server-side.
      // Karaoke Next / Previous: the destination is shown the moment it is
      // pressed. The Skip run does seconds of page work before it re-renders
      // the card, and the outgoing song stayed on screen meanwhile (measured
      // 3-13 s Cloud-like). The overlay lives on the parent body, outside
      // Streamlit's React tree, over the card, the source banner and the lead
      // sheet; it lifts when the render for that entry arrives.
      const DEST_MS = 90000;
      function esc(v) {
        return String(v || "").replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function readDest(dir) {
        let m = null;
        try { m = window.parent.document.querySelector('.ui-karaoke-transition-dest[data-dir="' + dir + '"]'); } catch (e) { return null; }
        if (!m) return null;
        const g = function (k) { return m.getAttribute("data-" + k) || ""; };
        return { entry: g("entry"), title: g("title"), artist: g("artist"), key: g("key"), bpm: g("bpm"), source: g("source") };
      }
      function clearDest() {
        try { window.parent.__krTransitionDest = null; } catch (e) {}
        try { window.parent.document.querySelectorAll(".kr-transition-dest").forEach(function (n) { n.remove(); }); } catch (e) {}
      }
      function currentDest() {
        let d = null;
        try { d = window.parent.__krTransitionDest; } catch (e) { return null; }
        if (d && Date.now() > Number(d.until)) { clearDest(); return null; }
        return d || null;
      }
      function overlayOn(pdoc, target, id, inner, style) {
        let o = pdoc.getElementById(id);
        const r = target ? target.getBoundingClientRect() : null;
        if (!r || !r.width || !r.height) { if (o) o.remove(); return; }
        if (!o) {
          o = pdoc.createElement("div");
          o.id = id;
          o.className = "kr-transition-dest";
          o.setAttribute("aria-live", "polite");
          pdoc.body.appendChild(o);
        }
        if (o.dataset.inner !== inner) { o.innerHTML = inner; o.dataset.inner = inner; }
        const w = pdoc.defaultView;
        Object.assign(o.style, {
          position: "absolute", left: (r.left + w.scrollX) + "px", top: (r.top + w.scrollY) + "px",
          width: r.width + "px", height: r.height + "px", zIndex: "999990", pointerEvents: "none",
          boxSizing: "border-box", overflow: "hidden", fontFamily: "inherit",
        }, style);
      }
      function paintDest() {
        const d = currentDest();
        if (!d) return;
        let pdoc = null;
        try { pdoc = window.parent.document; } catch (e) { return; }
        const card = pdoc.querySelector(".ui-backing-active-song");
        const banner = pdoc.querySelector(".ui-backing-context-banner");
        const sheet = Array.prototype.find.call(pdoc.querySelectorAll("iframe"), function (f) {
          try { return !!(f.contentDocument && f.contentDocument.getElementById("live-chord")); } catch (e) { return false; }
        });
        const facts = [d.source, d.key ? "Key " + d.key : "", d.bpm ? d.bpm + " BPM" : ""].filter(Boolean).join(" · ");
        let bg = "linear-gradient(135deg, #1e3a8a, #312e81)";
        let radius = "16px";
        try {
          const cs = window.parent.getComputedStyle(card);
          if (cs.backgroundImage && cs.backgroundImage !== "none") bg = cs.backgroundImage;
          radius = cs.borderRadius || radius;
        } catch (e) {}
        overlayOn(pdoc, card, "kr-dest-card",
          '<div style="padding:14px 18px;color:#fff">' +
          '<div style="font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Now Singing · Starting…</div>' +
          '<div style="font-size:1.25rem;font-weight:800;margin-top:4px">' + esc(d.title) +
          (d.artist ? '<span style="opacity:.8;font-weight:600"> — ' + esc(d.artist) + "</span>" : "") + "</div>" +
          '<div style="font-size:.9rem;margin-top:6px;opacity:.92">' + esc(facts) + "</div></div>",
          { background: bg, backgroundColor: "#1e3a8a", borderRadius: radius });
        overlayOn(pdoc, banner, "kr-dest-banner",
          '<div style="padding:0.55rem 0.75rem;font-size:0.88rem;font-weight:750;color:#0f172a">Backing source: ' +
          esc([d.source, d.title, d.key, d.bpm ? d.bpm + " BPM" : ""].filter(Boolean).join(" · ")) + "</div>",
          { background: "rgb(248, 250, 252)", borderLeft: "4px solid #64748b", borderRadius: "10px" });
        overlayOn(pdoc, sheet, "kr-dest-sheet",
          '<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:0 16px;text-align:center;' +
          'font-size:1.05rem;font-weight:700;color:#0f172a">Loading the lead sheet for ' + esc(d.title) + "…</div>",
          { background: "rgba(248, 250, 252, 0.96)", borderRadius: "10px" });
      }
      function showTransitionDest(dir) {
        const d = readDest(dir);
        if (!d || !d.entry) return;
        try { window.parent.__krTransitionDest = Object.assign(d, { until: Date.now() + DEST_MS }); } catch (e) { return; }
        paintDest();
      }
      window.parent.__backingTransportOnTransition = function (dir) {
        clearSheetPosition();
        showTransitionDest(dir === "previous" ? "previous" : "next");
        backingAudio().forEach(function (a) { if (srcOf(a)) silenced.add(srcOf(a)); });
        silenceBackingAudio();
        pendingUntil = Date.now() + 120000;
        saveSilenced();
        stoppingUntil = Date.now() + 1500;
        pendingUntil = Date.now() + 120000;
        pendingToken = "transition";
        savePending();
        render();
      };
      try {
        const pdoc = window.parent.document;
        if (window.parent.__backingTransportTransitionHook) {
          pdoc.removeEventListener("click", window.parent.__backingTransportTransitionHook, true);
        }
        window.parent.__backingTransportTransitionHook = function (ev) {
          const closest = function (sel) { return ev && ev.target && ev.target.closest ? ev.target.closest(sel) : null; };
          const t = closest('[class*="st-key-karaoke_skip_to_next"] button, [class*="st-key-karaoke_previous_song"] button');
          if (t && !t.disabled && typeof window.parent.__backingTransportOnTransition === "function") {
            const prev = !!(t.closest && t.closest('[class*="st-key-karaoke_previous_song"]'));
            window.parent.__backingTransportOnTransition(prev ? "previous" : "next");
          }
          // End Karaoke Set ends playback like Stop, from the moment it is pressed.
          const endSet = closest('[class*="st-key-karaoke_inline_end_set"] button, [class*="st-key-karaoke_stop_session"] button');
          if (endSet && !endSet.disabled) {
            stoppingUntil = Date.now() + 1500;
            pendingUntil = 0;
            savePending();
            silenceBackingAudio();
            setLocal("stopped");
            render();
          }
          if (closest('[class*="st-key-backing_leadsheet_show_btn"] button, [class*="st-key-backing_leadsheet_hide_btn"] button')) {
            recordHandoff();
          }
        };
        pdoc.addEventListener("click", window.parent.__backingTransportTransitionHook, true);
      } catch (e) {}
      btn.addEventListener("click", function () {
        if (btn.dataset.state !== "stopped") {
          // Stop ends the session -- playing, paused or still starting.
          stoppingUntil = Date.now() + 1500;
          pendingUntil = 0;
          savePending();
          silenceBackingAudio();
          try { window.parent.__backingPausedTake = null; } catch (e) {}
          clearSheetPosition();
          send("stop");
          setLocal("stopped");
        } else if (args.enabled) {
          pendingUntil = Date.now() + 120000;
          send("play");
          pendingToken = SESSION + ":" + nonce;
          setLocal("playing");
          savePending();
        }
        render();
      });
      pz.addEventListener("click", function () {
        if (pz.dataset.mode === "resume") doResume(false);
        else doPause(false);
      });
      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "streamlit:render") return;
        args = Object.assign(args, event.data.args || {});
        // The destination's own render has arrived: its card replaces the overlay.
        const dest = currentDest();
        if (dest && args.now_singing && args.now_singing === dest.entry) clearDest();
        // The Play request was handled (new render) but nothing is starting.
        if (pendingUntil && args.consumed === pendingToken && !args.server_playing && args.transport !== "playing") { pendingUntil = 0; savePending(); }
        // The server has handled the latest click: its intent is authoritative again.
        if (localIntent && args.consumed === localToken) { localIntent = ""; localUntil = 0; }
        render();
      });
      post("streamlit:componentReady", { apiVersion: 1 });
      post("streamlit:setFrameHeight", { height: 52 });
      lastHeight = 52;
      setInterval(render, 250);
    </script>
  </body>
</html>
