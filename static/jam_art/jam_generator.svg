<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" preserveAspectRatio="xMaxYMid slice" role="img" aria-label="A dark-blue night stage under spotlights with a guitar, bass, keyboard, drum kit and microphone">
  <!-- Jam Session Generator card artwork: hand-drawn for this app. A late-night club stage, the whole band set up. -->
  <defs>
    <linearGradient id="jg-night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset="0.6" stop-color="#132a5e"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="jg-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bfdbfe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jg-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0b1330" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="jg-cym" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="960" height="300" fill="url(#jg-night)"/>
  <!-- stars / room lights -->
  <g fill="#dbeafe">
    <circle cx="60" cy="40" r="1.6" opacity="0.8"/><circle cx="150" cy="80" r="1.2" opacity="0.6"/>
    <circle cx="240" cy="30" r="1.8" opacity="0.7"/><circle cx="330" cy="66" r="1.2" opacity="0.5"/>
    <circle cx="420" cy="24" r="1.5" opacity="0.8"/><circle cx="96" cy="128" r="1.1" opacity="0.4"/>
    <circle cx="300" cy="118" r="1.4" opacity="0.45"/><circle cx="520" cy="58" r="1.3" opacity="0.6"/>
  </g>
  <!-- lighting truss -->
  <rect x="430" y="8" width="530" height="8" fill="#1e293b"/>
  <g fill="#334155"><rect x="520" y="14" width="22" height="16" rx="3"/><rect x="660" y="14" width="22" height="16" rx="3"/><rect x="800" y="14" width="22" height="16" rx="3"/></g>
  <!-- spotlights -->
  <polygon points="526,28 536,28 640,300 430,300" fill="url(#jg-beam)"/>
  <polygon points="666,28 676,28 790,300 570,300" fill="url(#jg-gold)"/>
  <polygon points="806,28 816,28 940,300 700,300" fill="url(#jg-beam)"/>
  <!-- stage -->
  <rect x="380" y="252" width="580" height="48" fill="url(#jg-floor)"/>
  <rect x="380" y="250" width="580" height="4" fill="#60a5fa" opacity="0.7"/>
  <ellipse cx="535" cy="254" rx="70" ry="8" fill="#bfdbfe" opacity="0.25"/>
  <ellipse cx="680" cy="254" rx="80" ry="9" fill="#fde68a" opacity="0.2"/>
  <ellipse cx="820" cy="254" rx="80" ry="9" fill="#bfdbfe" opacity="0.25"/>
  <!-- amp -->
  <g transform="translate(440 200)">
    <rect width="60" height="52" rx="5" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="6" y="6" width="48" height="8" rx="2" fill="#334155"/>
    <circle cx="30" cy="33" r="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="30" cy="33" r="5" fill="#475569"/>
  </g>
  <!-- electric guitar on a stand -->
  <g transform="translate(512 98)">
    <rect x="22" y="0" width="12" height="20" rx="3" fill="#0f172a"/>
    <rect x="25" y="18" width="6" height="84" fill="#78350f"/>
    <path d="M28 98 c-24 -4 -34 14 -26 30 c4 8 -6 14 -4 26 c4 22 22 26 30 26 c8 0 28 -4 32 -26 c2 -12 -8 -18 -4 -26 c8 -16 -2 -34 -28 -30 z" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
    <rect x="18" y="132" width="20" height="6" rx="2" fill="#0f172a"/>
    <rect x="18" y="146" width="20" height="5" rx="2" fill="#cbd5e1"/>
    <line x1="10" y1="180" x2="2" y2="154" stroke="#64748b" stroke-width="3"/>
    <line x1="46" y1="180" x2="54" y2="154" stroke="#64748b" stroke-width="3"/>
  </g>
  <!-- keyboard -->
  <g transform="translate(590 194)">
    <line x1="14" y1="30" x2="4" y2="58" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="126" y1="30" x2="136" y2="58" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <rect x="0" y="6" width="140" height="28" rx="5" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="6" y="14" width="128" height="16" rx="2" fill="#f8fafc"/>
    <g fill="#0f172a">
      <rect x="14" y="14" width="6" height="10"/><rect x="27" y="14" width="6" height="10"/><rect x="46" y="14" width="6" height="10"/>
      <rect x="59" y="14" width="6" height="10"/><rect x="72" y="14" width="6" height="10"/><rect x="91" y="14" width="6" height="10"/>
      <rect x="104" y="14" width="6" height="10"/><rect x="123" y="14" width="6" height="10"/>
    </g>
  </g>
  <!-- microphone at the front -->
  <g transform="translate(756 138)">
    <line x1="10" y1="22" x2="10" y2="114" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="10" y1="114" x2="-8" y2="116" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="10" y1="114" x2="28" y2="116" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="3" y="0" width="14" height="24" rx="7" fill="#e2e8f0"/>
    <g stroke="#94a3b8" stroke-width="1"><line x1="4" y1="6" x2="16" y2="6"/><line x1="4" y1="11" x2="16" y2="11"/><line x1="4" y1="16" x2="16" y2="16"/></g>
  </g>
  <!-- drum kit -->
  <g transform="translate(800 156)">
    <line x1="0" y1="34" x2="0" y2="96" stroke="#94a3b8" stroke-width="3"/>
    <ellipse cx="0" cy="32" rx="30" ry="5" fill="url(#jg-cym)"/>
    <line x1="132" y1="20" x2="132" y2="96" stroke="#94a3b8" stroke-width="3"/>
    <ellipse cx="132" cy="18" rx="34" ry="6" fill="url(#jg-cym)" transform="rotate(-8 132 18)"/>
    <circle cx="66" cy="70" r="30" fill="#0f172a" stroke="#60a5fa" stroke-width="4"/>
    <circle cx="66" cy="70" r="20" fill="#1e3a8a"/>
    <text x="66" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#bfdbfe">&#9835;</text>
    <rect x="26" y="36" width="28" height="16" rx="5" fill="#2563eb"/>
    <rect x="78" y="34" width="28" height="16" rx="5" fill="#2563eb"/>
    <rect x="110" y="62" width="34" height="32" rx="5" fill="#1d4ed8"/>
    <ellipse cx="127" cy="62" rx="17" ry="4" fill="#93c5fd"/>
  </g>
  <!-- bass guitar leaning at the side -->
  <g transform="translate(930 78) rotate(12)">
    <rect x="-4" y="0" width="12" height="16" rx="3" fill="#0f172a"/>
    <rect x="-1" y="14" width="6" height="104" fill="#78350f"/>
    <path d="M2 112 c-20 -2 -28 14 -22 28 c4 8 -4 12 -2 22 c4 18 18 22 24 22 c6 0 20 -4 24 -22 c2 -10 -6 -14 -2 -22 c6 -14 -2 -30 -22 -28 z" fill="#f8fafc" stroke="#60a5fa" stroke-width="2"/>
  </g>
</svg>
